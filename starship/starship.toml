"$schema" = "https://starship.rs/config-schema.json"
# EmberDay starship prompt, part of cosmic-emberday-theme (MIT).
# Close to the defaults, coloured from the palette: secondary-text directory,
# branch in the yellow slot, the warning colour for a dirty tree, a success
# prompt character (the error colour after a failed command), HH:MM clock on
# the right. Modules without a style here keep their defaults, which use the
# ANSI slots the COSMIC Terminal scheme already colours.

format = "$all"
right_format = "$time"
palette = "emberday"

[palettes.emberday]
accent = "#A4441A"
warning = "#8A5E12"
success = "#4C6B45"
error = "#9E3A3A"
third = "#8A5E12"
secondary = "#5C5F67"
faint = "#6B6F78"
dim = "#8C9099"
fg = "#2B2E36"

[character]
success_symbol = "[❯](bold success)"
error_symbol = "[❯](bold error)"
vimcmd_symbol = "[❮](bold third)"

[directory]
style = "bold secondary"
read_only_style = "error"
repo_root_style = "bold third"

[git_branch]
style = "bold third"

[git_commit]
style = "bold third"

[git_state]
style = "bold warning"

[git_status]
style = "warning"

[git_metrics]
added_style = "success"
deleted_style = "error"

[username]
style_user = "success"
style_root = "bold error"

[hostname]
style = "success"

[cmd_duration]
style = "faint"

[status]
style = "bold error"

[sudo]
style = "bold warning"

[jobs]
style = "warning"

[dart]
disabled = true

[time]
disabled = false
time_format = "%H:%M"
format = "[$time]($style)"
style = "dim"
