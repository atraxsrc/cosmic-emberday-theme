# EmberDay colour scheme for qt5ct / qt6ct, part of cosmic-emberday-theme (MIT).
# The rice's window colour for windows, its containers for buttons and
# tooltips, its text colour, the accent as highlight with the button text
# colour on it, dim placeholders.
#
# Install: ./qt/install.sh puts this in ~/.config/qt5ct/colors/ and
# ~/.config/qt6ct/colors/. Then in qt5ct / qt6ct: Appearance -> Color scheme
# -> EmberDay, Palette: Custom, Apply. Qt apps need QT_QPA_PLATFORMTHEME=qt5ct
# (or qt6ct) in the environment to read it.
#
# Roles, in order: WindowText, Button, Light, Midlight, Dark, Mid, Text,
# BrightText, ButtonText, Base, Window, Shadow, Highlight, HighlightedText,
# Link, LinkVisited, AlternateBase, NoRole, ToolTipBase, ToolTipText,
# PlaceholderText
[ColorScheme]
active_colors=#2b2e36, #e2ded6, #e2ded6, #bbb9b2, #cbc8c0, #ddd9d1, #2b2e36, #25272e, #2b2e36, #e9e6df, #e9e6df, #cbc8c0, #a4441a, #e9e6df, #9f4219, #9f4219, #e2ded6, #e9e6df, #e2ded6, #2b2e36, #6b6f78
disabled_colors=#8c9099, #e2ded6, #e2ded6, #bbb9b2, #cbc8c0, #ddd9d1, #8c9099, #5c5f67, #8c9099, #e9e6df, #e9e6df, #cbc8c0, #bbb9b2, #5c5f67, #6b6f78, #6b6f78, #e2ded6, #e9e6df, #e2ded6, #2b2e36, #bbb9b2
inactive_colors=#2b2e36, #e2ded6, #e2ded6, #bbb9b2, #cbc8c0, #ddd9d1, #2b2e36, #25272e, #2b2e36, #e9e6df, #e9e6df, #cbc8c0, #a4441a, #e9e6df, #9f4219, #9f4219, #e2ded6, #e9e6df, #e2ded6, #2b2e36, #6b6f78
