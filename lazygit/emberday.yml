# EmberDay for lazygit, part of cosmic-emberday-theme (MIT). Only the colours: your
# own ~/.config/lazygit/config.yml keeps the rest.
#
# Install: ./lazygit/install.sh puts this in ~/.config/lazygit/emberday.yml and
# zsh/emberday.zsh sets LG_CONFIG_FILE to "config.yml,emberday.yml" so lazygit
# reads both (the later file wins). Without the zsh layer:
#   export LG_CONFIG_FILE="$HOME/.config/lazygit/config.yml,$HOME/.config/lazygit/emberday.yml"
gui:
  theme:
    activeBorderColor:
      - "#A4441A"
      - bold
    inactiveBorderColor:
      - "#BBB9B2"
    searchingActiveBorderColor:
      - "#8A5E12"
      - bold
    optionsTextColor:
      - "#5C5F67"
    selectedLineBgColor:
      - "#CBC8C0"
    inactiveViewSelectedLineBgColor:
      - "#E9E6DF"
    cherryPickedCommitFgColor:
      - "#DDD9D1"
    cherryPickedCommitBgColor:
      - "#8A5E12"
    markedBaseCommitFgColor:
      - "#DDD9D1"
    markedBaseCommitBgColor:
      - "#4C6B45"
    unstagedChangesColor:
      - "#9E3A3A"
    defaultFgColor:
      - "#2B2E36"
  authorColors:
    "*": "#8A5E12"
